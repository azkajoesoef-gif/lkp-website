<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berita — Lingkar Peduli Anak Negeri</title>
  <link rel="icon" type="image/png" href="assets/img/logo-lkp.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <style>
    .artikel {
      max-width: 780px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 30px rgba(11,37,69,0.08);
    }
    .artikel__img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      background: var(--color-bg-alt);
    }
    .artikel__body { padding: 40px; }
    @media (max-width: 600px) { .artikel__body { padding: 24px 20px; } }

    .artikel__meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--color-text-soft);
      flex-wrap: wrap;
    }
    .artikel__kat {
      background: rgba(201,162,75,0.15);
      color: var(--color-primary);
      padding: 4px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .artikel__dot { color: var(--color-border); }
    .artikel__judul {
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.3;
      margin-bottom: 20px;
      color: var(--color-primary);
      font-family: var(--font-heading);
      font-weight: 800;
    }

    /* Reading time */
    .artikel__reading {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--color-text-soft);
      background: var(--color-bg-alt);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    .artikel__konten {
      color: var(--color-text);
      font-size: 16px;
      line-height: 1.85;
      white-space: pre-line;
      margin-bottom: 32px;
    }
    .artikel__konten p { margin-bottom: 20px; }
    .artikel__konten::first-letter {
      font-family: var(--font-heading);
      font-size: 3.2em;
      font-weight: 800;
      color: var(--color-accent);
      float: left;
      line-height: 0.9;
      margin: 4px 12px 0 0;
      padding: 4px 8px;
    }

    /* SHARE BAR */
    .share-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 20px;
      background: var(--color-bg-alt);
      border-radius: 12px;
      margin-bottom: 24px;
      border-left: 4px solid var(--color-accent);
    }
    .share-bar__label {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      color: var(--color-primary);
      margin-right: 8px;
    }
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-family: var(--font-heading);
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 200ms ease;
      color: #fff;
    }
    .share-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }
    .share-btn--wa { background: #25D366; }
    .share-btn--fb { background: #1877F2; }
    .share-btn--tw { background: #000; }
    .share-btn--tg { background: #0088CC; }
    .share-btn--copy {
      background: var(--color-navy);
    }
    .share-btn--copy.is-copied {
      background: var(--color-hijau);
    }

    /* Back button */
    .artikel__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 20px;
      background: var(--color-cta);
      color: #fff;
      border-radius: 8px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: all 200ms ease;
    }
    .artikel__back:hover {
      background: var(--color-merah-dark);
      color: #fff;
      transform: translateX(-3px);
    }

    /* RELATED */
    .related {
      max-width: 1000px;
      margin: 60px auto 0;
    }
    .related__head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .related__head::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--color-accent), transparent);
    }
    .related__title {
      font-family: var(--font-heading);
      font-size: 20px;
      color: var(--color-primary);
      margin: 0;
    }
    .related__grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    @media (max-width: 800px) { .related__grid { grid-template-columns: 1fr; } }
    .related__card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 14px rgba(11,37,69,0.06);
      text-decoration: none;
      color: inherit;
      transition: all 240ms ease;
      display: flex;
      flex-direction: column;
    }
    .related__card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 36px rgba(11,37,69,0.14);
    }
    .related__img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: var(--color-bg-alt);
    }
    .related__body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .related__meta {
      font-size: 11px;
      color: var(--color-text-soft);
      margin-bottom: 8px;
    }
    .related__judul {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1.35;
      margin: 0 0 8px;
      flex: 1;
    }
    .related__cta {
      color: var(--color-cta);
      font-size: 12px;
      font-weight: 700;
    }

    .loading-block { text-align: center; padding: 80px 20px; color: var(--color-text-soft); }
  </style>
</head>
<body>

  <section class="section">
    <div class="container">
      <div id="artikelContainer">
        <div class="loading-block">Memuat berita...</div>
      </div>

      <!-- RELATED -->
      <div class="related" id="relatedWrap" style="display:none;">
        <div class="related__head">
          <h3 class="related__title">Berita Terkait</h3>
        </div>
        <div class="related__grid" id="relatedGrid"></div>
      </div>
    </div>
  </section>

  <script type="module">
    import './assets/js/components.js';
    import { fetchBeritaBySlug, fetchBerita, formatTanggal, escapeHtml } from './assets/js/api.js';

    const container = document.getElementById('artikelContainer');
    const relatedWrap = document.getElementById('relatedWrap');
    const relatedGrid = document.getElementById('relatedGrid');

    function readingTime(text) {
      const words = String(text || '').split(/\s+/).length;
      const min = Math.max(1, Math.round(words / 200));
      return `${min} menit baca`;
    }

    async function renderArtikel() {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');

      if (!slug) {
        container.innerHTML = `<div class="loading-block"><h3>Berita tidak ditemukan</h3></div>`;
        return;
      }

      try {
        const b = await fetchBeritaBySlug(slug);
        if (!b) {
          container.innerHTML = `<div class="loading-block"><h3>Berita tidak ditemukan</h3></div>`;
          return;
        }

        document.title = `${b.judul} — LKP`;
        const pageUrl = `https://lingkarpedulianaknegeri.id/berita-detail.html?slug=${encodeURIComponent(slug)}`;
        const shareText = encodeURIComponent(`${b.judul} — Lingkar Peduli Anak Negeri`);

        container.innerHTML = `
          <article class="artikel">
            <img class="artikel__img" src="${escapeHtml(b.thumbnail)}" alt="${escapeHtml(b.judul)}"
                 onerror="this.src='https://placehold.co/1200x600/0B2545/C9A24B?text=Berita'">
            <div class="artikel__body">
              <div class="artikel__meta">
                <span class="artikel__kat">${escapeHtml(b.kategori || 'Umum')}</span>
                <span class="artikel__dot">•</span>
                <span>${formatTanggal(b.tanggal)}</span>
              </div>
              <h1 class="artikel__judul">${escapeHtml(b.judul)}</h1>
              <div class="artikel__reading">⏱️ ${readingTime(b.konten || b.ringkasan)}</div>
              <div class="artikel__konten">${escapeHtml(b.konten || b.ringkasan || '')}</div>

              <div class="share-bar">
                <span class="share-bar__label">Bagikan:</span>
                <a class="share-btn share-btn--wa" href="https://wa.me/?text=${shareText}%20${encodeURIComponent(pageUrl)}" target="_blank" rel="noopener">WhatsApp</a>
                <a class="share-btn share-btn--fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}" target="_blank" rel="noopener">Facebook</a>
                <a class="share-btn share-btn--tw" href="https://twitter.com/intent/tweet?text=${shareText}&url=${encodeURIComponent(pageUrl)}" target="_blank" rel="noopener">Twitter</a>
                <a class="share-btn share-btn--tg" href="https://t.me/share/url?url=${encodeURIComponent(pageUrl)}&text=${shareText}" target="_blank" rel="noopener">Telegram</a>
                <button class="share-btn share-btn--copy" id="copyBtn" data-url="${escapeHtml(pageUrl)}">🔗 Copy Link</button>
              </div>

              <a href="berita.html" class="artikel__back">← Kembali ke Berita</a>
            </div>
          </article>
        `;

        // Copy button
        document.getElementById('copyBtn').addEventListener('click', async (e) => {
          const btn = e.currentTarget;
          try {
            await navigator.clipboard.writeText(btn.dataset.url);
            btn.textContent = '✓ Link Dicopy!';
            btn.classList.add('is-copied');
            setTimeout(() => {
              btn.textContent = '🔗 Copy Link';
              btn.classList.remove('is-copied');
            }, 2000);
          } catch (err) {
            alert('Gagal copy. Copy manual: ' + btn.dataset.url);
          }
        });

        // Load related
        await renderRelated(b);

      } catch (err) {
        container.innerHTML = `<div class="loading-block"><h3>Gagal memuat</h3><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    async function renderRelated(current) {
      try {
        const all = await fetchBerita();
        // Prioritas: kategori sama, exclude current
        let related = all.filter(x => x.slug !== current.slug && x.kategori === current.kategori);
        // Kalau kurang dari 3, tambah dari kategori lain
        if (related.length < 3) {
          const others = all.filter(x => x.slug !== current.slug && x.kategori !== current.kategori);
          related = related.concat(others);
        }
        related = related.slice(0, 3);

        if (!related.length) return;

        relatedWrap.style.display = 'block';
        relatedGrid.innerHTML = related.map(r => `
          <a href="berita-detail.html?slug=${encodeURIComponent(r.slug)}" class="related__card">
            <img class="related__img" src="${escapeHtml(r.thumbnail)}" alt="${escapeHtml(r.judul)}" loading="lazy"
                 onerror="this.src='https://placehold.co/800x500/0B2545/C9A24B?text=Berita'">
            <div class="related__body">
              <div class="related__meta">${formatTanggal(r.tanggal)} · ${escapeHtml(r.kategori || 'Umum')}</div>
              <h4 class="related__judul">${escapeHtml(r.judul)}</h4>
              <span class="related__cta">Baca →</span>
            </div>
          </a>
        `).join('');
      } catch (err) {
        console.warn('Related load error:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', renderArtikel);
  </script>
</body>
</html>
