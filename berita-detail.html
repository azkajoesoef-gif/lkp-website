<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berita — Lingkar Peduli Anak Negeri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">

  <style>
    .artikel {
      max-width: 780px;
      margin: 0 auto;
      background: #fff;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .artikel__img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      background: var(--color-bg-alt);
    }
    .artikel__body { padding: var(--space-8); }
    .artikel__meta {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
      font-size: var(--fs-sm);
      color: var(--color-text-soft);
    }
    .artikel__kategori {
      background: var(--color-bg-alt);
      color: var(--color-primary);
      padding: 3px 12px;
      border-radius: 999px;
      font-weight: 600;
    }
    .artikel__judul {
      font-size: var(--fs-2xl);
      line-height: 1.3;
      margin-bottom: var(--space-6);
    }
    .artikel__konten {
      color: var(--color-text);
      font-size: var(--fs-base);
      line-height: 1.8;
      white-space: pre-line;
    }
    .artikel__back {
      display: inline-block;
      margin-top: var(--space-8);
    }
    .loading { text-align: center; padding: var(--space-16); color: var(--color-text-soft); }
  </style>
</head>
<body>

  <section class="section">
    <div class="container">
      <div id="artikelContainer">
        <div class="loading">Memuat berita...</div>
      </div>
    </div>
  </section>

  <script type="module">
    import './assets/js/components.js';
    import { fetchBeritaBySlug, formatTanggal, escapeHtml } from './assets/js/api.js';

    const container = document.getElementById('artikelContainer');

    async function renderArtikel() {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');

      if (!slug) {
        container.innerHTML = `<div class="loading">Berita tidak ditemukan.</div>`;
        return;
      }

      try {
        const b = await fetchBeritaBySlug(slug);

        if (!b) {
          container.innerHTML = `<div class="loading">Berita tidak ditemukan.</div>`;
          return;
        }

        document.title = `${b.judul} — LKP`;

        container.innerHTML = `
          <article class="artikel">
            <img class="artikel__img" src="${escapeHtml(b.thumbnail)}" alt="${escapeHtml(b.judul)}"
                 onerror="this.src='https://picsum.photos/seed/fallback/1200x600'">
            <div class="artikel__body">
              <div class="artikel__meta">
                <span class="artikel__kategori">${escapeHtml(b.kategori || 'Umum')}</span>
                <span>${formatTanggal(b.tanggal)}</span>
              </div>
              <h1 class="artikel__judul">${escapeHtml(b.judul)}</h1>
              <div class="artikel__konten">${escapeHtml(b.konten || b.ringkasan || '')}</div>
              <a href="berita.html" class="btn btn--primary artikel__back">← Kembali ke Berita</a>
            </div>
          </article>
        `;

      } catch (err) {
        container.innerHTML = `<div class="loading">Gagal memuat: ${escapeHtml(err.message)}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', renderArtikel);
  </script>
</body>
</html>
