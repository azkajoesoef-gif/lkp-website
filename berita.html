<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berita — Lingkar Peduli Anak Negeri</title>
  <meta name="description" content="Berita, kegiatan, dan rilis pers Lingkar Peduli Anak Negeri.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">

  <style>
    .berita-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-6);
    }
    .berita-card {
      background: #fff;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }
    .berita-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-4px);
    }
    .berita-card__img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: var(--color-bg-alt);
    }
    .berita-card__body {
      padding: var(--space-6);
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .berita-card__meta {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
      font-size: var(--fs-xs);
      color: var(--color-text-soft);
    }
    .berita-card__kategori {
      background: var(--color-bg-alt);
      color: var(--color-primary);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 600;
    }
    .berita-card__judul {
      font-size: var(--fs-lg);
      margin-bottom: var(--space-3);
      line-height: 1.3;
      color: var(--color-primary);
    }
    .berita-card__ringkasan {
      color: var(--color-text-soft);
      font-size: var(--fs-sm);
      flex: 1;
      margin-bottom: var(--space-4);
    }
    .berita-card__link {
      color: var(--color-cta);
      font-weight: 600;
      font-size: var(--fs-sm);
    }
    .loading, .empty-state {
      text-align: center;
      padding: var(--space-16) var(--space-6);
      color: var(--color-text-soft);
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="container">
      <p class="page-header__eyebrow">Berita</p>
      <h1>Kabar Terbaru dari LKP</h1>
      <p class="page-header__lead">
        Update kegiatan, rilis pers, dan informasi terkini dari Lingkar Peduli Anak Negeri.
      </p>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div id="beritaContainer" class="berita-grid">
        <div class="loading" style="grid-column:1/-1;">Memuat berita...</div>
      </div>
    </div>
  </section>

  <script type="module">
    import './assets/js/components.js';
    import { fetchBerita, formatTanggal, escapeHtml } from './assets/js/api.js';

    const container = document.getElementById('beritaContainer');

    async function renderBerita() {
      try {
        const berita = await fetchBerita();

        if (!berita.length) {
          container.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <h3>Belum ada berita</h3>
              <p>Berita akan muncul di sini setelah ditambahkan oleh pengurus.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = berita.map(b => `
          <a href="berita-detail.html?slug=${encodeURIComponent(b.slug)}" class="berita-card">
            <img class="berita-card__img" src="${escapeHtml(b.thumbnail)}" alt="${escapeHtml(b.judul)}" loading="lazy"
                 onerror="this.src='https://picsum.photos/seed/fallback/800x500'">
            <div class="berita-card__body">
              <div class="berita-card__meta">
                <span class="berita-card__kategori">${escapeHtml(b.kategori || 'Umum')}</span>
                <span>${formatTanggal(b.tanggal)}</span>
              </div>
              <h3 class="berita-card__judul">${escapeHtml(b.judul)}</h3>
              <p class="berita-card__ringkasan">${escapeHtml(b.ringkasan || '')}</p>
              <span class="berita-card__link">Baca selengkapnya →</span>
            </div>
          </a>
        `).join('');

      } catch (err) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <h3>Gagal memuat berita</h3>
            <p>${escapeHtml(err.message)}</p>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', renderBerita);
  </script>
</body>
</html>
