<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeri Kegiatan — Lingkar Peduli Anak Negeri</title>
  <meta name="description" content="Dokumentasi kegiatan Lingkar Peduli Anak Negeri.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <style>
    .galeri-filter {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .galeri-filter__btn {
      background: #fff;
      border: 2px solid var(--color-border);
      color: var(--color-text-soft);
      padding: 8px 20px;
      border-radius: 999px;
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 180ms ease;
    }
    .galeri-filter__btn:hover {
      border-color: var(--color-accent);
      color: var(--color-primary);
    }
    .galeri-filter__btn.is-active {
      background: var(--color-navy);
      border-color: var(--color-navy);
      color: #fff;
    }

    .galeri-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .galeri-item {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 4/3;
      box-shadow: 0 4px 14px rgba(11,37,69,0.08);
      transition: all 220ms cubic-bezier(.4,0,.2,1);
      background: var(--color-bg-alt);
    }
    .galeri-item:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 20px 40px rgba(11,37,69,0.18);
    }
    .galeri-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 400ms ease;
    }
    .galeri-item:hover img { transform: scale(1.08); }
    .galeri-item__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(11,37,69,0.85) 100%);
      opacity: 0;
      transition: opacity 220ms ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 18px;
      color: #fff;
    }
    .galeri-item:hover .galeri-item__overlay { opacity: 1; }
    .galeri-item__kat {
      display: inline-block;
      background: var(--color-accent);
      color: var(--color-navy);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      align-self: flex-start;
      margin-bottom: 8px;
    }
    .galeri-item__title {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 4px;
      line-height: 1.3;
      color: #fff;
    }
    .galeri-item__date {
      font-size: 11px;
      color: rgba(255,255,255,0.75);
      margin: 0;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(7,26,51,0.95);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fadeIn 200ms ease;
    }
    .lightbox.is-open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .lightbox__content {
      max-width: 900px;
      width: 100%;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .lightbox__img {
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      background: #000;
    }
    .lightbox__body {
      padding: 20px 24px;
    }
    .lightbox__title {
      font-family: var(--font-heading);
      font-size: 18px;
      color: var(--color-primary);
      margin: 0 0 6px;
    }
    .lightbox__caption {
      color: var(--color-text-soft);
      font-size: 14px;
      margin: 0 0 10px;
    }
    .lightbox__meta {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 12px;
      color: var(--color-text-soft);
    }
    .lightbox__close {
      position: absolute;
      top: 14px; right: 14px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 180ms;
    }
    .lightbox__close:hover { background: var(--color-cta); }

    .loading-block {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-text-soft);
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="container">
      <p class="page-header__eyebrow">Galeri</p>
      <h1>Dokumentasi Kegiatan</h1>
      <p class="page-header__lead">
        Momen-momen nyata aksi LKP untuk masyarakat Indonesia.
      </p>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="galeri-filter" id="filterBar"></div>
      <div class="galeri-grid" id="galeriGrid">
        <div class="loading-block" style="grid-column:1/-1;">Memuat galeri...</div>
      </div>
    </div>
  </section>

  <div class="lightbox" id="lightbox">
    <div class="lightbox__content">
      <button class="lightbox__close" id="lightboxClose" aria-label="Tutup">✕</button>
      <img class="lightbox__img" id="lightboxImg" alt="">
      <div class="lightbox__body">
        <h3 class="lightbox__title" id="lightboxTitle"></h3>
        <p class="lightbox__caption" id="lightboxCaption"></p>
        <div class="lightbox__meta">
          <span id="lightboxKat"></span>
          <span>•</span>
          <span id="lightboxDate"></span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import './assets/js/components.js';
    import { fetchGaleri, formatTanggal, escapeHtml } from './assets/js/api.js';

    const grid = document.getElementById('galeriGrid');
    const filterBar = document.getElementById('filterBar');
    const lightbox = document.getElementById('lightbox');
    let allItems = [];
    let activeKat = 'Semua';

    function renderGrid(items) {
      if (!items.length) {
        grid.innerHTML = '<div class="loading-block" style="grid-column:1/-1;">Belum ada foto galeri.</div>';
        return;
      }
      grid.innerHTML = items.map((item, i) => `
        <div class="galeri-item" data-idx="${i}">
          <img src="${escapeHtml(item.foto_url)}" alt="${escapeHtml(item.judul)}" loading="lazy"
               onerror="this.src='https://placehold.co/800x600/0B2545/C9A24B?text=Foto'">
          <div class="galeri-item__overlay">
            <span class="galeri-item__kat">${escapeHtml(item.kategori || 'Umum')}</span>
            <h3 class="galeri-item__title">${escapeHtml(item.judul)}</h3>
            <p class="galeri-item__date">${formatTanggal(item.tanggal)}</p>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.galeri-item').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.idx);
          openLightbox(items[idx]);
        });
      });
    }

    function renderFilter() {
      const categories = ['Semua', ...new Set(allItems.map(i => i.kategori).filter(Boolean))];
      filterBar.innerHTML = categories.map(c => `
        <button class="galeri-filter__btn ${c === activeKat ? 'is-active' : ''}" data-kat="${escapeHtml(c)}">
          ${escapeHtml(c)}
        </button>
      `).join('');
      filterBar.querySelectorAll('.galeri-filter__btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeKat = btn.dataset.kat;
          const filtered = activeKat === 'Semua'
            ? allItems
            : allItems.filter(i => i.kategori === activeKat);
          renderGrid(filtered);
          renderFilter();
        });
      });
    }

    function openLightbox(item) {
      document.getElementById('lightboxImg').src = item.foto_url;
      document.getElementById('lightboxImg').onerror = function() {
        this.src = 'https://placehold.co/1200x800/0B2545/C9A24B?text=Foto';
      };
      document.getElementById('lightboxTitle').textContent = item.judul || '';
      document.getElementById('lightboxCaption').textContent = item.caption || '';
      document.getElementById('lightboxKat').textContent = item.kategori || 'Umum';
      document.getElementById('lightboxDate').textContent = formatTanggal(item.tanggal);
      lightbox.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    async function init() {
      try {
        allItems = await fetchGaleri();
        renderGrid(allItems);
        renderFilter();
      } catch (err) {
        grid.innerHTML = `<div class="loading-block" style="grid-column:1/-1;">Gagal memuat: ${escapeHtml(err.message)}</div>`;
      }
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
